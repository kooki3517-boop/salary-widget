/* Unified underground lost-and-found styling — visual only */

</style></head><body><main class="app"><header class="top"><button id="sound" class="sound">♪</button></header>
<section id="home"><div class="scene"></div><div class="panel"><h2>어쩌면 이미 답은 정해져 있을지도 모릅니다.</h2><textarea id="question" rows="3" placeholder="궁금한 것을 적어도 되고, 비워도 괜찮아요."></textarea><div id="deck" class="deck">☾</div><button id="draw" class="btn">카드 열기</button></div></section>

<script>
let cards=[],current=null,soundOn=true;const $=s=>document.querySelector(s),click=$('#click');fetch('cards.json?v=20261104-restore-meaning').then(r=>r.json()).then(x=>{cards=x;if(!$('#records').classList.contains('hidden'))render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
let lastClickAt=0;
function clicky(){
  if(!soundOn)return;

  lastClickAt=now;
  click.pause();click.currentTime=0;
  click.play().catch(()=>{});
}
document.addEventListener('click',e=>{if(e.target.closest('button'))clicky()});
// Web Audio buffer playback avoids HTMLMediaElement media-session UI on many browsers.
// System-level notification behavior is ultimately controlled by the OS/browser.
let bgmCtx=null, bgmBuffers=null, bgmNodes=[], bgmLoading=null, bgmToken=0;

  if(!bgmCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;bgmCtx=new AC()}

function preloadBgm(){
  const ctx=getBgmContext();if(!ctx)return Promise.reject(new Error('Web Audio unavailable'));
  if(!bgmLoading)bgmLoading=Promise.all(['bgm.wav','rail-ambience.wav'].map(async url=>{
    const r=await fetch(url);if(!r.ok)throw Error('Audio loading failed');
    return ctx.decodeAudioData(await r.arrayBuffer());
  })).then(buffers=>(bgmBuffers=buffers)).catch(e=>{bgmLoading=null;throw e});

}
function stopBgm(){
  ++bgmToken;

  ctx.resume().catch(()=>{});

}
function unlockSound(){if(soundOn)startBgm()}
preloadBgm().catch(()=>{});
window.addEventListener('DOMContentLoaded',startBgm,{once:true});

for(const type of ['pointerdown','touchstart','click','keydown'])document.addEventListener(type,unlockSound,{capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopBgm();else if(soundOn)startBgm()});

$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'♪':'×';if(soundOn)startBgm();else stopBgm()};
function cardCode(name){const major=['The Fool','The Magician','The High Priestess','The Empress','The Emperor','The Hierophant','The Lovers','The Chariot','Strength','The Hermit','Wheel of Fortune','Justice','The Hanged Man','Death','Temperance','The Devil','The Tower','The Star','The Moon','The Sun','Judgement','The World'];let i=major.indexOf(name);if(i>=0)return 'ar'+String(i).padStart(2,'0');const suits={Wands:'wa',Cups:'cu',Swords:'sw',Pentacles:'pe'};for(const [suit,prefix] of Object.entries(suits)){if(name.endsWith(' of '+suit)){const rank=name.slice(0,-(' of '+suit).length),ranks={Ace:1,Two:2,Three:3,Four:4,Five:5,Six:6,Seven:7,Eight:8,Nine:9,Ten:10,Page:11,Knight:12,Queen:13,King:14};return prefix+String(ranks[rank]).padStart(2,'0')}}return 'ar00'}

function secureRandomInt(max){if(!Number.isSafeInteger(max)||max<1||max>4294967296)throw new RangeError('Invalid random range');const range=4294967296,limit=Math.floor(range/max)*max,buf=new Uint32Array(1);do{crypto.getRandomValues(buf)}while(buf[0]>=limit);return buf[0]%max}
$('#draw').onclick=()=>{if(!cards.length)return;let choice=secureRandomInt(cards.length*2);let c=cards[Math.floor(choice/2)],rev=(choice%2===1);current={...c,rev,q:$('#question').value.trim()};$('#ct').textContent=c.en+' · '+c.ko;$('#or').textContent=rev?'역방향 REVERSED':'정방향 UPRIGHT';$('#meaning').textContent=(rev?c.r:c.u);const code=cardCode(c.en);const img=$('#cardimg');img.style.display='block';img.alt='';img.classList.toggle('reversed',rev);let sources=['https://raw.githubusercontent.com/sixseeds/tarot-api/main/cards/'+code+'.jpg','https://cdn.jsdelivr.net/gh/sixseeds/tarot-api@main/cards/'+code+'.jpg','https://petaloverflow.github.io/tarot-api/cards/'+code+'.jpg'];let si=0;img.onerror=()=>{si++;if(si<sources.length){img.src=sources[si]}else{img.onerror=null;img.style.display='none'}};img.src=sources[0];$('#face').style.transform='none';$('#reflection').value='';show('result')};

$('#again').onclick=()=>show('home');$('#homeNav').onclick=()=>show('home');$('#recordsNav').onclick=()=>show('records');
function render(){let a=JSON.parse(localStorage.getItem('boriRecords')||'[]'),l=$('#list');if(!a.length){l.innerHTML='<div class="empty">아직 보관된 마음이 없어요.</div>';return}l.innerHTML=a.map((x,i)=>{const original=cards.find(c=>String(c.en).trim().toLowerCase()===String(x.en||'').trim().toLowerCase()),meaning=(x.rev?(x.r||original?.r):(x.u||original?.u))||'';return `<div class="item"><b>${new Date(x.at).toLocaleString('ko-KR')}</b><br>${esc(String(x.en||''))} · ${esc(String(x.ko||''))} / ${x.rev?'역방향':'정방향'}${x.q?`<p>Q. ${esc(String(x.q))}</p>`:''}${meaning?`<p class="record-meaning"><b>카드 해석</b><span>${esc(String(meaning))}</span></p>`:''}${x.text?`<p>${esc(String(x.text))}</p>`:''}<button type="button" class="record-delete" data-index="${i}">삭제</button></div>`}).join('')}
$('#list').addEventListener('click',e=>{const btn=e.target.closest('.record-delete');if(!btn)return;const index=Number(btn.dataset.index);if(!Number.isInteger(index)||!confirm('이 마음 기록을 삭제하시겠어요?'))return;const records=JSON.parse(localStorage.getItem('boriRecords')||'[]');if(index<0||index>=records.length)return;records.splice(index,1);localStorage.setItem('boriRecords',JSON.stringify(records));render()});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
